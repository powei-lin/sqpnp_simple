[package]
name = "sqpnp_simple"
version = "0.3.0"
edition = "2024"
authors = ["Powei Lin <poweilin1994@gmail.com>"]
readme = "README.md"
license = "MIT OR Apache-2.0"
description = "SQPnp camera pose estimation"
homepage = "https://github.com/powei-lin/sqpnp_simple"
repository = "https://github.com/powei-lin/sqpnp_simple"
keywords = ["solvepnp", "vision", "pose"]
categories = ["data-structures", "science", "mathematics", "science::robotics"]
exclude = ["/.github/*", "*.ipynb", "./scripts/*", "examples/*", "tests/*"]

[features]
default = ["glam-0-30", "nalgebra-0-33"]
glam-0-30 = ["dep:glam_0_30"]
glam-0-31 = ["dep:glam_0_31"]
glam-0-32 = ["dep:glam_0_32"]
glam-0-33 = ["dep:glam_0_33"]
glam-0-34 = ["dep:glam_0_34"]
nalgebra-0-33 = ["dep:nalgebra_0_33"]
nalgebra-0-34 = ["dep:nalgebra_0_34"]
nalgebra-0-35 = ["dep:nalgebra_0_35"]

[dependencies]
glam_0_30 = { package = "glam", version = "0.30.0", optional = true }
glam_0_31 = { package = "glam", version = "0.31", optional = true }
glam_0_32 = { package = "glam", version = "0.32", optional = true }
glam_0_33 = { package = "glam", version = "0.33", optional = true }
glam_0_34 = { package = "glam", version = "0.34", optional = true }
log = "0.4.22"
nalgebra_0_33 = { package = "nalgebra", version = "0.33.2", features = ["rand"], optional = true }
nalgebra_0_34 = { package = "nalgebra", version = "0.34", features = ["rand"], optional = true }
nalgebra_0_35 = { package = "nalgebra", version = "0.35", features = ["rand"], optional = true }

[[example]]
name = "random_points"

[[example]]
name = "random_points_plane"

[dev-dependencies]
env_logger = "0.11.5"
rand = "0.9.0"
diol = "0.8.0"

[[bench]]
name = "sqpnp_benchmark"
harness = false

